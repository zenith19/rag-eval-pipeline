name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        # Integration tests need the Qdrant container and a built index; the
        # conftest skips them automatically when Qdrant is unreachable, and the
        # skip reason is printed. The retrieval regression gate arrives in R3,
        # where it runs against a real index.
        run: pytest tests/ -q -rs
